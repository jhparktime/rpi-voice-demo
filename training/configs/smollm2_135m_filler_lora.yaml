model_name_or_path: HuggingFaceTB/SmolLM2-135M-Instruct

data:
  train_file: training/data/filler_train.jsonl
  val_file: training/data/filler_val.jsonl
  max_train_samples: null
  max_eval_samples: null

output:
  output_dir: outputs/smollm2-135m-filler-lora
  logging_dir: outputs/smollm2-135m-filler-lora/logs

training:
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 10
  eval_steps: 50
  save_steps: 50
  save_total_limit: 2
  evaluation_strategy: steps
  save_strategy: steps
  bf16: false
  fp16: true
  gradient_checkpointing: true
  seed: 42

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

generation_eval:
  max_new_tokens: 16
  temperature: 0.2
  top_p: 0.9
  do_sample: true
